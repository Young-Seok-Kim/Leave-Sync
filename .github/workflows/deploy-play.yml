name: Play Store 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 번 배포되지 않도록 직렬화
concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/yeoncha-manager.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/yeoncha-manager.jks
          PROPS

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos

      - name: 테스트
        run: flutter test

      - name: AAB 빌드
        # 아이콘 폰트 tree-shaking 이 깨져 아이콘이 한자로 보이는 문제가 있어 비활성화
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Play Store 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.youngs.leavesync
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # 저장소 변수 PLAY_TRACK 으로 트랙 변경 (internal / alpha / beta / production)
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt
