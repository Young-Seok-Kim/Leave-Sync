name: Play Store 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 번 배포되지 않도록 직렬화
concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  # pubspec.yaml 의 version 이 바뀐 푸시에서만 배포 (같은 versionCode 는 Play 가 거부함)
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.ver.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 버전 변경 여부 확인
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행: 배포 진행"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=$(git show HEAD^:pubspec.yaml 2>/dev/null | grep -E '^version:' || true)
          after=$(grep -E '^version:' pubspec.yaml)
          echo "이전: ${before:-없음} / 현재: $after"
          if [ "$before" != "$after" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "pubspec 버전이 바뀌지 않아 배포를 건너뜁니다."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/yeoncha-manager.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../app/yeoncha-manager.jks
          PROPS

      - name: 환경 파일(.env) 복원
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: echo "$ENV_FILE" > .env

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos

      - name: 테스트
        run: flutter test

      - name: AAB 빌드
        # 아이콘 폰트 tree-shaking 이 깨져 아이콘이 한자로 보이는 문제가 있어 비활성화
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: 빌드 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Play Store 업로드
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.youngs.leavesync
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # 저장소 변수 PLAY_TRACK 으로 트랙 변경 (internal / alpha / beta / production)
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          # 스토어 "새로운 기능" 문구: 배포 전에 이 폴더의 whatsnew-ko-KR 을 수정할 것
          whatsNewDirectory: distribution/whatsnew
